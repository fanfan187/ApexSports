# =============================================
# ApexSports 学生运动会管理系统 - 配置文件
# =============================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: apex-sports

  # =============================================
  # 数据源配置
  # =============================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/apex_sports?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: sports_user
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  # =============================================
  # Redis配置
  # =============================================
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
      redisson:
        config: |
                  singleServerConfig:
                    address: redis://localhost:6379
                    database: 0
        

  # =============================================
  # Jackson配置
  # =============================================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# =============================================
# MyBatis-Plus配置
# =============================================
mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.fanfan.apexsports.entities
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: as_

# =============================================
# SpringDoc OpenAPI配置
# =============================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# =============================================
# Knife4j配置
# =============================================
knife4j:
  enable: true
  setting:
    language: zh_cn

# =============================================
# 日志配置
# =============================================
logging:
  level:
    root: INFO
    com.fanfan.apexsports: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# =============================================
# Redisson配置
# =============================================